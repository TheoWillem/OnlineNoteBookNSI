<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours NSI - Notebook Interactif</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/editor/editor.main.css">
</head>
<body>
    <main class="main-content full-width">
        <div class="toolbar">
            <div class="toolbar-left">
                <button id="homeButton" class="btn-home" style="display: none;">
                    <span class="btn-home-icon">←</span>
                    <span class="btn-home-text">Retour aux cours</span>
                </button>
            </div>
            <h1 id="courseTitle">📚 Cours NSI - Notebook Interactif</h1>
            <div class="toolbar-right progress-actions">
                <button id="importProgressButton" class="btn btn-secondary btn-small" type="button" style="display: none;" title="Charger un travail précédemment exporté">📂 Importer</button>
                <button id="exportProgressButton" class="btn btn-primary btn-small" type="button" style="display: none;" title="Télécharger les réponses de ce cours">💾 Exporter</button>
                <input id="importProgressFile" type="file" accept=".json,application/json" hidden>
            </div>
        </div>
        
        <div class="content-container">
            <!-- Page d'accueil avec les cartes de cours -->
            <div id="courseSelection" class="course-selection">
                <div class="welcome-header">
                    <h2>Bienvenue sur la plateforme de cours NSI</h2>
                    <p>Choisissez un cours pour commencer votre apprentissage interactif</p>
                </div>
                <div id="courseGrid" class="course-grid">
                    <!-- Les cartes de cours seront chargées ici -->
                </div>
            </div>
            
            <!-- Contenu du cours (caché par défaut) -->
            <div id="courseContent" class="course-content" style="display: none;">
            </div>
            
            <!-- Bouton toggle TOC (indépendant, toujours visible) -->
            <button id="tocToggle" class="toc-toggle" style="display: none;" aria-label="Toggle table of contents">
                <span class="toc-toggle-icon">«</span>
            </button>
            
            <!-- Table des matières (visible uniquement dans les cours) -->
            <aside id="tocSidebar" class="toc-sidebar" style="display: none;">
                <div class="toc-header">
                    <h3>Table des matières</h3>
                </div>
                <nav id="tocContent" class="toc-content">
                    <!-- La table des matières sera générée ici -->
                </nav>
            </aside>
            
            <!-- Bouton flottant pour ouvrir la TOC sur mobile -->
            <button id="tocFloatingButton" class="toc-floating-button" style="display: none;" aria-label="Open table of contents">
                📑
            </button>
        </div>

        <!-- Modal pour les graphiques et sorties -->
        <div id="outputModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="modalBody"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="markdown-colors.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <script src="app.js"></script>
</body>
</html>
